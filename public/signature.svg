<svg xmlns="http://www.w3.org/2000/svg" id="still" width="556" height="320" viewBox="7 8 556 320">
  <title>Christian Anagnostou</title>
  <style>
    /* The finished ink is the default, including reduced motion and print. */
    @media screen and (prefers-reduced-motion: no-preference) {
      svg:not(:target) .initial { animation: curl 320ms linear 100ms backwards; }
      svg:not(:target) .given { animation: across 230ms linear 420ms backwards; }
      svg:not(:target) .upstroke { animation: up 150ms linear 650ms backwards; }
      svg:not(:target) .downstroke { animation: down 150ms linear 800ms backwards; }
      svg:not(:target) .crossbar { animation: across 70ms linear 950ms backwards; }
      svg:not(:target) .family { animation: across 280ms linear 1020ms backwards; }
    }
    @keyframes across {
      from { clip-path: inset(0 100% 0 0) fill-box; }
      to { clip-path: inset(0) fill-box; }
    }
    @keyframes up {
      from { clip-path: inset(100% 0 0) fill-box; }
      to { clip-path: inset(0) fill-box; }
    }
    @keyframes down {
      from { clip-path: inset(0 0 100%) fill-box; }
      to { clip-path: inset(0) fill-box; }
    }
    /* Follow the open C counterclockwise, from its top terminal to its lower one. */
    @keyframes curl {
      0% { clip-path: polygon(55% 50%, 104% 24%, 104% 24%, 104% 24%, 104% 24%, 104% 24%, 104% 24%) fill-box; }
      22% { clip-path: polygon(55% 50%, 104% 24%, 104% -4%, 40% -4%, 40% -4%, 40% -4%, 40% -4%) fill-box; }
      52% { clip-path: polygon(55% 50%, 104% 24%, 104% -4%, -4% -4%, -4% 55%, -4% 55%, -4% 55%) fill-box; }
      78% { clip-path: polygon(55% 50%, 104% 24%, 104% -4%, -4% -4%, -4% 104%, 35% 104%, 35% 104%) fill-box; }
      100% { clip-path: polygon(55% 50%, 104% 24%, 104% -4%, -4% -4%, -4% 104%, 104% 104%, 104% 50%) fill-box; }
    }
  </style>
