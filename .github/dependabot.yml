version: 2
updates:
  # Configuration for npm dependencies (Next.js and related packages)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
    groups:
      npm-dependencies:
        patterns: ['*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']

  # Configuration for GitHub Actions dependencies (e.g., workflow files)
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
